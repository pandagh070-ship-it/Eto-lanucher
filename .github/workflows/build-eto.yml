name: Build Eto Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-eto.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eto Launcher configuration
        uses: actions/checkout@v4

      - name: Fetch open-source launcher engine
        run: |
          git clone --depth 1 https://github.com/TeamPojavLauncher/PojavLauncher.git upstream
          echo "Upstream source downloaded:"
          git -C upstream log -1 --oneline

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Eto app name
        shell: bash
        run: |
          set -e
          STRINGS="upstream/app_pojavlauncher/src/main/res/values/strings.xml"
          test -f "$STRINGS"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/app_pojavlauncher/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          old = '<string name="app_short_name">PojavLauncher</string>'
          new = '<string name="app_short_name">Eto Launcher</string>'
          if old not in s:
              raise SystemExit("Could not locate expected app label; stopping the build.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("App label set to Eto Launcher.")
          PY

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eto-launcher-debug-apk
          path: upstream/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
