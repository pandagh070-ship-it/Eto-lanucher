name: Build Eto Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-eto.yml"
      - "README.md"
      - "eto-ui/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eto Launcher configuration
        uses: actions/checkout@v4

      - name: Fetch launcher engine with required submodules
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/TeamPojavLauncher/PojavLauncher.git upstream
          git -C upstream log -1 --oneline

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Eto branding and landscape launcher
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/app_pojavlauncher/build.gradle")
          lines = p.read_text(encoding="utf-8").splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if "resValue" in line and ("'app_name'" in line or '"app_name"' in line or "'app_short_name'" in line or '"app_short_name"' in line):
                  line = line.rsplit(",", 1)[0] + ', "Eto Launcher"'
                  lines[i] = line
                  changed += 1
          if changed < 6:
              raise SystemExit(f"Expected to replace 6 app name values, changed {changed}")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Replaced {changed} app-name values with Eto Launcher.")

          manifest = Path("upstream/app_pojavlauncher/src/main/AndroidManifest.xml")
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          targets = {"net.kdt.pojavlaunch.TestStorageActivity", ".TestStorageActivity",
                     "net.kdt.pojavlaunch.LauncherActivity", ".LauncherActivity"}
          for activity in root.iter("activity"):
              if activity.get(ns + "name") in targets:
                  activity.set(ns + "screenOrientation", "landscape")
          app = root.find("application")
          app.set(ns + "icon", "@drawable/eto_launcher_icon")
          app.set(ns + "roundIcon", "@drawable/eto_launcher_icon")
          app.set(ns + "label", "Eto Launcher")
          for activity in root.iter("activity"):
              # Override upstream labels everywhere.
              activity.set(ns + "label", "Eto Launcher")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          strings = Path("upstream/app_pojavlauncher/src/main/res/values/strings.xml")
          text = strings.read_text(encoding="utf-8")
          import re
          text = re.sub(r'(<string name="app_short_name">).*?(</string>)', r'\\1Eto Launcher\\2', text)
          strings.write_text(text, encoding="utf-8")

          styles = Path("upstream/app_pojavlauncher/src/main/res/values/styles.xml")
          text = styles.read_text(encoding="utf-8")
          theme = '<style name="MojoLauncher" parent="@style/Theme.AppCompat.NoActionBar">'
          contrast = theme + '\n        <item name="android:textColorPrimary">#F2F5F9</item>\n        <item name="android:textColorSecondary">#B8C2CE</item>\n        <item name="colorControlNormal">#314052</item>\n        <item name="colorControlActivated">#15945A</item>\n        <item name="colorAccent">#15945A</item>\n        <item name="android:statusBarColor">#000000</item>\n        <item name="android:navigationBarColor">#000000</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:windowLightNavigationBar">false</item>'
          if theme not in text:
              raise SystemExit("Could not find MojoLauncher theme in styles.xml")
          text = text.replace(theme, contrast, 1)
          styles.write_text(text, encoding="utf-8")
          print("Eto app label and global contrast colors applied.")
          PY

      - name: Apply Eto custom launcher interface
        run: |
          cp eto-ui/fragment_launcher.xml upstream/app_pojavlauncher/src/main/res/layout/fragment_launcher.xml
          cp eto-ui/fragment_launcher.xml upstream/app_pojavlauncher/src/main/res/layout-land/fragment_launcher.xml
          cp eto-ui/activity_pojav_launcher.xml upstream/app_pojavlauncher/src/main/res/layout/activity_pojav_launcher.xml
          cp eto-ui/activity_pojav_launcher.xml upstream/app_pojavlauncher/src/main/res/layout-land/activity_pojav_launcher.xml
          cp eto-ui/fragment_local_login.xml upstream/app_pojavlauncher/src/main/res/layout/fragment_local_login.xml
          cp eto-ui/fragment_local_login.xml upstream/app_pojavlauncher/src/main/res/layout-land/fragment_local_login.xml
          cp eto-ui/fragment_select_auth_method.xml upstream/app_pojavlauncher/src/main/res/layout/fragment_select_auth_method.xml
          cp eto-ui/fragment_select_auth_method.xml upstream/app_pojavlauncher/src/main/res/layout-land/fragment_select_auth_method.xml
          cp eto-ui/colors.xml upstream/app_pojavlauncher/src/main/res/values/colors.xml
          cp eto-ui/eto_news_banner.xml upstream/app_pojavlauncher/src/main/res/drawable/eto_news_banner.xml
          cp eto-ui/eto_launcher_icon.xml upstream/app_pojavlauncher/src/main/res/drawable/eto_launcher_icon.xml
          cp eto-ui/ic_eto_home.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_home.xml
          cp eto-ui/ic_eto_add.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_add.xml
          cp eto-ui/ic_eto_controls.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_controls.xml
          cp eto-ui/ic_eto_folder.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_folder.xml
          cp eto-ui/ic_eto_logs.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_logs.xml
          cp eto-ui/ic_eto_edit.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_edit.xml
          cp eto-ui/ic_eto_settings.xml upstream/app_pojavlauncher/src/main/res/drawable/ic_eto_settings.xml
          # Replace legacy launcher icon assets in every density with the new Eto mark.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("upstream/app_pojavlauncher/src/main/res")
          source = root / "drawable" / "eto_launcher_icon.xml"
          for folder in root.glob("mipmap-*"):
              if not folder.is_dir():
                  continue
              for name in ("ic_launcher.xml", "ic_launcher_round.xml", "ic_launcher_foreground.xml"):
                  target = folder / name
                  if target.exists() and target.suffix == ".xml":
                      shutil.copyfile(source, target)
          # Ensure the manifest's icon and roundIcon both point to Eto's custom mark.
          print("Replaced legacy XML launcher icon resources where present.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/app_pojavlauncher/src/main/res/values/styles.xml")
          s = p.read_text(encoding="utf-8")
          anchor = '<style name="MojoLauncher" parent="@style/Theme.AppCompat.NoActionBar">'
          fix = anchor + '''
                  <item name="android:textColorPrimary">#F2F5F9</item>
                  <item name="android:textColorSecondary">#B8C2CE</item>
                  <item name="android:textColor">#F2F5F9</item>
                  <item name="colorAccent">#19A765</item>\n                <item name="android:statusBarColor">#000000</item>\n                <item name="android:navigationBarColor">#000000</item>\n                <item name="android:windowLightStatusBar">false</item>\n                <item name="android:windowLightNavigationBar">false</item>'''
          if anchor not in s:
              raise SystemExit("Could not find MojoLauncher theme in styles.xml")
          s = s.replace(anchor, fix, 1)
          p.write_text(s, encoding="utf-8")
          print("Applied dark default text colors to launcher and settings theme.")
          PY

      - name: Add functional Eto customization
        run: python3 scripts/patch_eto_customization.py
      - name: Build Eto debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eto-launcher-debug-apk
          path: upstream/app_pojavlauncher/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
