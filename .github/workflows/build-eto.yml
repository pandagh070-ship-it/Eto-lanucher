name: Build Eto Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-eto.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eto Launcher configuration
        uses: actions/checkout@v4

      - name: Fetch open-source launcher engine
        run: |
          git clone --depth 1 https://github.com/TeamPojavLauncher/PojavLauncher.git upstream
          echo "Upstream source downloaded:"
          git -C upstream log -1 --oneline

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Eto branding
        shell: bash
        run: |
          set -e
          STRINGS="upstream/app_pojavlauncher/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            echo "Launcher strings file found."
            grep -n -m 3 -E 'app_name|PojavLauncher' "$STRINGS" || true
          else
            echo "Could not find expected strings file; stopping rather than producing an unbranded APK."
            exit 1
          fi

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eto-launcher-debug-apk
          path: upstream/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
