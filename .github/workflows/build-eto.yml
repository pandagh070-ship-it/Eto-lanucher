name: Build Eto Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-eto.yml"
      - "README.md"
      - "eto-ui/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eto Launcher configuration
        uses: actions/checkout@v4

      - name: Fetch launcher engine with required submodules
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/TeamPojavLauncher/PojavLauncher.git upstream
          git -C upstream log -1 --oneline

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Eto branding and landscape launcher
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/app_pojavlauncher/build.gradle")
          s = p.read_text(encoding="utf-8")
          import re
          lines = []
          for line in s.splitlines():
              if "resValue" in line and ("app_name" in line or "app_short_name" in line):
                  key = "app_short_name" if "app_short_name" in line else "app_name"
                  line = re.sub(r"""(resValue\s+['"]string['"]\s*,\s*['"]""" + key + r"""['"]\s*,\s*)['"][^'"]*['"]""", r'\1"Eto Launcher"', line)
              lines.append(line)
          s = "\n".join(lines) + "\n"
          p.write_text(s, encoding="utf-8")

          manifest = Path("upstream/app_pojavlauncher/src/main/AndroidManifest.xml")
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          targets = {"net.kdt.pojavlaunch.TestStorageActivity", ".TestStorageActivity",
                     "net.kdt.pojavlaunch.LauncherActivity", ".LauncherActivity"}
          for activity in root.iter("activity"):
              if activity.get(ns + "name") in targets:
                  activity.set(ns + "screenOrientation", "landscape")
          app = root.find("application")
          app.set(ns + "icon", "@drawable/eto_launcher_icon")
          app.set(ns + "roundIcon", "@drawable/eto_launcher_icon")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Eto name, icon and landscape orientation applied.")
          PY

      - name: Apply Eto custom launcher interface
        run: |
          cp eto-ui/fragment_launcher.xml upstream/app_pojavlauncher/src/main/res/layout/fragment_launcher.xml
          cp eto-ui/fragment_launcher.xml upstream/app_pojavlauncher/src/main/res/layout-land/fragment_launcher.xml
          cp eto-ui/activity_pojav_launcher.xml upstream/app_pojavlauncher/src/main/res/layout/activity_pojav_launcher.xml
          cp eto-ui/activity_pojav_launcher.xml upstream/app_pojavlauncher/src/main/res/layout-land/activity_pojav_launcher.xml
          cp eto-ui/eto_news_banner.xml upstream/app_pojavlauncher/src/main/res/drawable/eto_news_banner.xml
          cp eto-ui/eto_launcher_icon.xml upstream/app_pojavlauncher/src/main/res/drawable/eto_launcher_icon.xml

      - name: Build Eto debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eto-launcher-debug-apk
          path: upstream/app_pojavlauncher/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
